[search]

# 是否在搜索阶段显示摄像头预览窗口。ESC/q 可关闭窗口
show_preview = true

# 是否启用神经网络检测。关闭后仅显示原始画面
enable_nn = true

# ONNX 模型路径
model_path = "model/yolov5s.onnx"

# 类别名文件（可省略，缺失时仅显示 class_id）
class_names_path = "model/coco.names"

# 置信度阈值，低于该值的检测结果会被过滤
nn_confidence_threshold = 0.5

# NMS (非极大值抑制) 的 IoU 阈值
nn_nms_threshold = 0.6