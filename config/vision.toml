[vision]
red_h1_min = 0
red_h1_max = 10
red_h2_min = 170
red_h2_max = 180
saturation_min = 100
value_min = 80
min_area = 200.0
morphology_kernel = 5

[vision.ball]
# ── 工作分辨率（16:9 对应 1280x720）──
work_width = 640
work_height = 360

# ── 管道模式：auto = 颜色检测, fixed = 固定四点 ──
pipe_mode = "fixed"

# ── 预设管道四点（工作分辨率坐标）──
pipe_fixed_tl_x = 27.0
pipe_fixed_tl_y = 176.0
pipe_fixed_tr_x = 608.0
pipe_fixed_tr_y = 143.0
pipe_fixed_br_x = 611.0
pipe_fixed_br_y = 190.0
pipe_fixed_bl_x = 25.0
pipe_fixed_bl_y = 215.0

# ── 管道搜索区域（工作分辨率内坐标，auto 模式使用）──
pipe_search_roi_x = 10
pipe_search_roi_y = 20
pipe_search_roi_w = 540
pipe_search_roi_h = 160

axis_x1 = 80.0
axis_y1 = 230.0
axis_x2 = 560.0
axis_y2 = 230.0
axis_length_cm = 25.0

# ── 棕色管道 HSV 阈值 ──
brown_h_min = 12
brown_h_max = 33
brown_s_min = 43
brown_s_max = 255
brown_v_min = 6
brown_v_max = 255

# ── 管道形态学 ──
pipe_close_kernel_w = 31
pipe_close_kernel_h = 9
pipe_open_kernel = 3

# ── 管道几何约束 ──
pipe_min_area_ratio = 0.05
pipe_min_aspect_ratio = 3.0
pipe_min_fill_ratio = 0.30
pipe_horizontal_angle_max = 25.0
pipe_min_short_side_px = 8.0

# ── 管道锁定 ──
pipe_stable_frames = 3
pipe_lost_timeout_frames = 30
pipe_similarity_center_max_px = 25.0
pipe_similarity_length_max_px = 40.0

# ── 透视展开 ──
pipe_warp_width = 500
pipe_warp_height = 120
pipe_inner_margin_x_ratio = 0.03
pipe_inner_margin_y_ratio = 0.10

# ── 管道实际长度(mm) ──
pipe_length_mm = 250.0

# ── 钢球检测参数 ──
bg_kernel = 31
threshold = 18
morph_kernel = 3

min_area = 40.0
max_area = 3000.0
min_circularity = 0.35
ball_min_aspect = 0.65
ball_max_aspect = 1.45
ball_min_local_contrast = 8.0
ball_max_centerline_distance_px = 35.0
max_axis_distance_px = 30.0
max_jump_px = 50.0

reacquire_after_lost_frames = 15

zero_mode = "startup"
zero_position_px = 240.5
zero_samples = 20
zero_range_px = 4.0

filter_alpha = 0.35
