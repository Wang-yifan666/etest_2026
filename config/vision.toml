[vision]
red_h1_min = 0
red_h1_max = 10
red_h2_min = 170
red_h2_max = 180
saturation_min = 100
value_min = 80
min_area = 200.0
morphology_kernel = 5

[vision.ball]
# ── 工作分辨率（16:9 对应 1280x720）──
work_width = 640
work_height = 360

# ── 管道模式：auto = 颜色检测, fixed = 固定四点 ──
pipe_mode = "auto"

# ── 管道几何平滑 ──
pipe_geometry_alpha = 0.25
pipe_update_each_frame = true

# ── 预设管道四点（工作分辨率坐标，fixed 模式使用）──
pipe_fixed_tl_x = 5.0
pipe_fixed_tl_y = 205.0
pipe_fixed_tr_x = 545.0
pipe_fixed_tr_y = 185.0
pipe_fixed_br_x = 548.0
pipe_fixed_br_y = 265.0
pipe_fixed_bl_x = 5.0
pipe_fixed_bl_y = 275.0

# ── 管道搜索区域（工作分辨率内坐标，auto 模式使用）──
pipe_search_roi_x = 0
pipe_search_roi_y = 70
pipe_search_roi_w = 640
pipe_search_roi_h = 210

axis_x1 = 80.0
axis_y1 = 230.0
axis_x2 = 560.0
axis_y2 = 230.0
axis_length_cm = 19.8

# ── 棕色管道 HSV 阈值 ──
brown_h_min = 5
brown_h_max = 50
brown_s_min = 25
brown_s_max = 255
brown_v_min = 35
brown_v_max = 230

# ── 管道形态学 ──
pipe_close_kernel_w = 31
pipe_close_kernel_h = 5
pipe_open_kernel = 3

# ── 管道几何约束 ──
pipe_min_area_ratio = 0.03
pipe_min_aspect_ratio = 3.0
pipe_min_fill_ratio = 0.20
pipe_horizontal_angle_max = 30.0
pipe_min_short_side_px = 8.0

# ── 管道锁定 ──
pipe_stable_frames = 3
pipe_lost_timeout_frames = 30
pipe_similarity_center_max_px = 25.0
pipe_similarity_length_max_px = 40.0

# ── 透视展开 ──
pipe_warp_width = 500
pipe_warp_height = 80
pipe_inner_margin_x_ratio = 0.03
pipe_inner_margin_y_ratio = 0.10

# ── 管道实际长度(mm) ──
pipe_length_mm = 250.0

# ── HoughCircles 检测参数 ──
hough_dp = 1.2
hough_min_distance = 30.0
hough_param1 = 80.0
hough_param2 = 14.0

ball_min_radius = 12
ball_max_radius = 27
ball_expected_radius = 21.0

ball_min_center_y_ratio = 0.20
ball_max_center_y_ratio = 0.80
ball_expected_center_y_ratio = 0.50

ball_max_inner_gray = 125.0
ball_min_ring_contrast = -5.0
ball_min_quality = 0.20

# ── alpha-beta 跟踪器 ──
tracker_alpha = 0.65
tracker_beta = 0.08
tracker_gate_ratio = 0.055
tracker_gate_growth_per_lost_frame = 0.25
tracker_max_gate_ratio = 0.18
tracker_max_speed_ratio_per_second = 2.0

tracker_max_predict_frames = 3
tracker_global_reacquire_frames = 15
reacquire_confirm_frames = 2
acquire_confirm_frames = 3
zero_position_ratio = 0.5

# ── 钢球检测参数（保留旧字段兼容）──
bg_kernel = 31
threshold = 18
morph_kernel = 3

min_area = 40.0
max_area = 3000.0
min_circularity = 0.35
ball_min_aspect = 0.65
ball_max_aspect = 1.45
ball_min_local_contrast = 8.0
ball_max_centerline_distance_px = 35.0
max_axis_distance_px = 30.0
max_jump_px = 50.0

reacquire_after_lost_frames = 15

zero_mode = "ratio"
zero_position_px = 240.5
zero_samples = 20
zero_range_px = 4.0

filter_alpha = 0.35

# ── 测试用视频输出（空=不保存，写入路径则保存调试视频）──
video_output = "data/output.mp4"

# ── BallNcnn 双模型配置 ──
[vision.ball_ncnn]
enabled = true

# 双模型路径（.param，.bin 自动推导）
full_model_param = "model/ncnn_160x640/best_160x640_fp16.ncnn.param"
center_model_param = "model/ncnn_160x224/best_160x224_fp16.ncnn.param"

# 输入尺寸
full_input_width = 640
full_input_height = 160
center_input_width = 224
center_input_height = 160

# ROI 原始尺寸
full_src_width = 1280
full_src_height = 320
center_src_width = 448
center_src_height = 320

# ── ROI 定位模式 ──
# "center_point" = 通过 pipe_center_x/y 反算左上角（旧逻辑）
# "topleft"      = 直接使用 full_roi_*/center_roi_* 左上角坐标
roi_location_mode = "topleft"

# Full ROI 左上角（1280×640 原图坐标）
full_roi_x = 0
full_roi_y = 160

# Center ROI 左上角（1280×640 原图坐标）
center_roi_x = 416
center_roi_y = 160

# ── Q3～Q5 启动标定线 ──
# 原图全局像素坐标；只比较球心 X，不限制球心 Y。
calibration_line_x = 640

# 球心位于 [line_x-tolerance, line_x+tolerance] 时视为在线上。
calibration_line_tolerance_px = 20

# 连续有效帧与稳定性要求。
calibration_max_jitter_px = 6.0

# 中心线 y（水平参考线，贯穿全图宽度，deprecated）
center_line_y = 320

# 物理中心 O（全局像素坐标，1280×640 原图，center_point 模式使用）
pipe_center_x = 640
pipe_center_y = 320

# 跟踪阈值
edge_guard_px = 24
lost_frames_to_reacquire = 2
stable_frames_to_center = 8

# 标定
calibration_frames = 8
calibration_timeout_ms = 1500
initial_center_limit_mm = 15.0
minimum_confidence = 0.45

# NCNN 选项
num_threads = 4
use_fp16_storage = true
use_fp16_arithmetic = true

# 坐标标定（分段线性插值：像素 ↔ 毫米）
# 1px ≈ 0.1760mm（1280×720 画面）
[vision.ball_ncnn.axis_calibration]
image_right_sign = 1
pixels = "0, 640, 1279"
positions_mm = "-112.64, 0.0, 112.46"
