[mode]
# 比赛时必须启用
enabled = true
name = "competition"

[runtime]
headless = false
allow_keyboard_exit = true
enable_self_check = true
enable_auto_recovery = true
camera_retry_interval_ms = 500
uart_retry_interval_ms = 1000

[logger]
file = true
# 比赛时关闭终端输出，减少 CPU 占用
terminal = true
directory = "data/log"
flush_each_write = true
min_level = "INFO"
# 单位 ms，每个节流窗口只输出一条匹配日志
throttle_interval_ms = 500

[camera]
source = "0"
width = 640
height = 480
fps = 30
fourcc = "MJPG"

[vision]
red_h1_min = 0
red_h1_max = 10
red_h2_min = 170
red_h2_max = 180
saturation_min = 100
value_min = 80
min_area = 200.0
morphology_kernel = 5

[uart]
device = "/dev/ttyAMA0"
baudrate = 115200
timeout_ms = 50
write_timeout_ms = 200
reconnect_interval_ms = 1000
auto_reconnect = true
max_line_length = 512
queue_capacity = 256
protocol_version = 4
handshake_timeout_ms = 1500
heartbeat_interval_ms = 500
heartbeat_timeout_ms = 2000

[search]
show_preview = true
enable_nn = false
model_path = "model/yolov5s.onnx"
class_names_path = "model/coco.names"
nn_confidence_threshold = 0.5
nn_nms_threshold = 0.4