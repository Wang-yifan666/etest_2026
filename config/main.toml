[uart]

# 树莓派或 WSL 中的实际串口设备。
# 比赛机若使用 USB-UART，建议改成 /dev/serial/by-id/... 的稳定路径。
device = "/dev/serial0"

baudrate = 115200

# poll() 的单次读等待时间。
timeout_ms = 50

# 单次完整发送允许的最大等待时间。
write_timeout_ms = 200

# 设备不存在或掉线后的重连周期。
reconnect_interval_ms = 1000
auto_reconnect = true

# 超长行视为坏包，丢弃到下一个换行。
max_line_length = 512

# 有界消息队列；满时优先保留错误、警告、完成、启动和按键事件。
queue_capacity = 256